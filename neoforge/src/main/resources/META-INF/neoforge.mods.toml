modLoader="javafml"
loaderVersion="[4,)"
license="MIT"

[[mixins]]
    config = "reterraforged-common.mixins.json"

[[mixins]]
    config = "reterraforged-neoforge.mixins.json"

[[mods]]
    modId="reterraforged"
    displayName="ReTerraForged"
    version="${version}"
    authors="dags,Won-Ton,raccoonman"
    credits="dags,Won-Ton,raccoonman"
    logoFile="logo.png"
    displayURL="https://github.com/Vladeezyy/reterraforged"
    issueTrackerURL="https://github.com/Vladeezyy/reterraforged/issues"
    description="Terrain generation for Minecraft ${minecraft_version} with configurable archipelagos, island mountains and volcanoes, adjustable island coasts and beaches, and corrected island biome routing."

[[dependencies.reterraforged]]
    modId="neoforge"
    mandatory=true
    versionRange="${neoforge_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.reterraforged]]
	modId = "minecraft"
	mandatory = true
	versionRange = "${minecraft_range_neoforge}"
	ordering = "NONE"
	side = "BOTH"
