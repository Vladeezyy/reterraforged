plugins {
    id "com.github.johnrengelman.shadow" version "7.1.2"
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath
    
    runs {
        client {
            ideConfigGenerated(true)
            // tools/clienttest.sh: -PrtfClientTest=<world> runs the client check (RTFClientTest)
            if (project.hasProperty("rtfClientTest")) {
                vmArg "-Drtf.clienttest=${project.rtfClientTest}"
                programArgs "--width", "1600", "--height", "900"
            }
        }
    }

    runs {
        data {
            data()
            programArgs "--all", "--mod", "reterraforged"
            programArgs "--output", file('src/generated/resources').absolutePath
            programArgs "--existing", file('src/generated/resources').absolutePath
        }
    }
}

configurations {
    common
    shadowCommon
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common
}

repositories {
    maven { url "https://maven.neoforged.net/releases/" }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"
    
//	compileOnly "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"
//  modImplementation("com.github.glitchfiend:TerraBlender-forge:${rootProject.minecraft_version}-${rootProject.terrablender_version}")
    
    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionNeoForge")) { transitive false }
}

sourceSets {
    main {
        resources {
            srcDirs += [
                "src/generated/resources"
            ]
        }
    }
}

processResources {
    def props = [
        "version": project.version,
        "minecraft_version": rootProject.minecraft_version,
        "minecraft_range_neoforge": rootProject.minecraft_range_neoforge,
        "neoforge_range": rootProject.neoforge_range
    ]
    inputs.properties props

    filesMatching("META-INF/neoforge.mods.toml") {
        expand props
    }
}

shadowJar {
    exclude "fabric.mod.json"
    exclude "architectury.common.json"

    configurations = [project.configurations.shadowCommon]
    archiveClassifier.set("shadow")
}

remapJar {
    atAccessWideners.add('reterraforged.accesswidener')

    input.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier.set("neoforge-${rootProject.minecraft_version}")
}

jar {
    archiveClassifier.set("dev")
}

processResources {
    duplicatesStrategy "exclude"
}

sourcesJar {
    duplicatesStrategy "exclude"
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}