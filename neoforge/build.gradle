plugins {
    id "com.gradleup.shadow" version "9.6.1"
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath
    
    runs {
        client {
            ideConfigGenerated(true)
            // tools/clienttest.sh: -PrtfClientTest=<world> runs the client check (RTFClientTest)
            if (project.hasProperty("rtfClientTest")) {
                vmArg "-Drtf.clienttest=${project.rtfClientTest}"
                programArgs "--width", "1600", "--height", "900"
            }
        }
    }
}

configurations {
    common
    shadowCommon
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common
}

repositories {
    maven { url "https://maven.neoforged.net/releases/" }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"
    
//	compileOnly "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"
//  modImplementation("com.github.glitchfiend:TerraBlender-forge:${rootProject.minecraft_version}-${rootProject.terrablender_version}")
    
    // no remapping on 26.1+: the plain common project (no namedElements / transformProduction configurations)
    common(project(path: ":common")) { transitive false }
    shadowCommon(project(path: ":common")) { transitive false }
}

sourceSets {
    main {
        resources {
            srcDirs += [
                "src/generated/resources"
            ]
        }
    }
}

processResources {
    def props = [
        "version": project.version,
        "minecraft_version": rootProject.minecraft_version,
        "minecraft_range_neoforge": rootProject.minecraft_range_neoforge,
        "neoforge_range": rootProject.neoforge_range
    ]
    inputs.properties props

    filesMatching("META-INF/neoforge.mods.toml") {
        expand props
    }
}

shadowJar {
    exclude "fabric.mod.json"
    exclude "architectury.common.json"

    configurations = [project.configurations.shadowCommon]
    archiveClassifier.set("shadow")
}

// without remapJar Architectury does not convert the access widener to NeoForge's access transformer: done on
// the shaded jar with Loom's own converter
dev.architectury.loom.accesstransformer.Aw2At.addToTask(project, tasks.named("shadowJar")) { settings ->
    settings.accessWideners.add(loom.accessWidenerPath.get().asFile.name)
}

// ... nor apply @ExpectPlatform (the platform implementations in platform/neoforge): the production transform,
// run on the shaded jar; this is the mod jar
tasks.register("transformShadowJar", dev.architectury.plugin.TransformingTask) {
    platform = "neoforge"
    input.set(tasks.named("shadowJar").flatMap { it.archiveFile })
    archiveClassifier = "neoforge-${rootProject.minecraft_version}"
    destinationDirectory = layout.buildDirectory.dir("libs")
    plusAssign(new dev.architectury.transformer.transformers.TransformExpectPlatform())
    dependsOn tasks.named("shadowJar")
}

tasks.named("assemble") {
    dependsOn tasks.named("transformShadowJar")
}

jar {
    archiveClassifier.set("dev")
}

processResources {
    duplicatesStrategy = "exclude"
}

sourcesJar {
    duplicatesStrategy = "exclude"
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}