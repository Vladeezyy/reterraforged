# Build on every push and pull request, then the release jars on real NeoForge and Fabric servers
# (tools/servertest.sh, structures left out). The jars are kept as artifacts.
name: Build

on:
  push:
    paths-ignore: ['**.md', 'docs/**', 'licenses/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # java_version from gradle.properties (21 for 1.21.x, 25 for 26.x); org.gradle.java.home points at a JDK on
      # the dev Mac and does not exist here
      - name: Prepare gradle.properties
        id: props
        run: |
          sed -i '/^org\.gradle\.java\.home=/d' gradle.properties
          v=$(sed -n 's/^java_version=//p' gradle.properties | tr -d '[:space:]')
          if [ -z "$v" ]; then
            case "$(sed -n 's/^minecraft_version=//p' gradle.properties)" in 26*) v=25 ;; *) v=21 ;; esac
          fi
          echo "java=$v" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ steps.props.outputs.java }}

      # v5, not v6: v6's caching is a proprietary component under Gradle's own terms of use
      - uses: gradle/actions/setup-gradle@v5

      # a second try when the first fails: a download from a Maven repository dropped now and then ("Got socket
      # exception during request", maven.fabricmc.net, 2026-10-23)
      - name: Build
        run: chmod +x gradlew && { ./gradlew build --console=plain || { echo "build failed, trying again"; sleep 30; ./gradlew build --console=plain; }; }

      # tools/servertest.sh: the release jars on real NeoForge and Fabric servers:
      # preset export, "rtf selftest", the world shape on both loaders (the structure pass is too long here)
      - name: Server test
        run: SKIP_STRUCTURES=1 JAVA=$JAVA_HOME/bin/java bash tools/servertest.sh

      - name: Upload server logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: server-logs
          path: |
            run/**/*.log
            run/**/logs/latest.log
          if-no-files-found: ignore

      - name: Upload jars
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: jars
          path: |
            */build/libs/*.jar
            build/libs/*.jar
          if-no-files-found: ignore
