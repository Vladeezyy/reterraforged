architectury {
    common("fabric", "neoforge")
}

loom {
    accessWidenerPath = file("src/main/resources/reterraforged.accesswidener")
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    modImplementation "com.github.glitchfiend:TerraBlender-neoforge:${rootProject.minecraft_version}-${rootProject.terrablender_version}"
	compileOnly "com.electronwill.night-config:toml:3.6.7"
	// @TargetHandler for the C2ME OpenCL fallback (MixinC2MEOpenCL); C2ME ships MixinSquared itself
	compileOnly "com.github.bawnorton.mixinsquared:mixinsquared-common:0.3.7-beta.1"
	annotationProcessor "com.github.bawnorton.mixinsquared:mixinsquared-common:0.3.7-beta.1"
	testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
	//compileOnly "lithostitched-forge:1.0.0"
}

repositories {
	maven {
		url "https://maven.bawnorton.com/releases"
		content { includeGroup "com.github.bawnorton.mixinsquared" }
	}
}

remapJar {
    archiveClassifier.set("${rootProject.minecraft_version}")
}

test {
	useJUnitPlatform()
}

// License texts inside both mod jars (common's resources are bundled into the NeoForge and Fabric jars)
processResources {
    from(rootProject.file('LICENSE')) { rename { 'LICENSE_reterraforged' } }
    from(rootProject.file('licenses')) { into 'licenses/reterraforged' }
}
