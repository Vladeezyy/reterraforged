plugins {
    id "com.gradleup.shadow" version "9.6.1"
}

architectury {
    platformSetupLoomIde()
    fabric()
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath
    
    runs {
        client {
            // tools/clienttest.sh: -PrtfClientTest=<world> runs the client check (RTFClientTest)
            if (project.hasProperty("rtfClientTest")) {
                vmArg "-Drtf.clienttest=${project.rtfClientTest}"
                programArgs "--width", "1600", "--height", "900"
            }
        }
    }
}

configurations {
    common
    shadowCommon
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
}

dependencies {
    implementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    api("net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}") { exclude group: 'net.fabricmc', module: 'fabric-loader' }
// 	modImplementation("com.github.glitchfiend:TerraBlender-fabric:${rootProject.minecraft_version}-${rootProject.terrablender_version}")
    
    // no remapping on 26.1+: the plain common project (no namedElements / transformProduction configurations)
    common(project(path: ":common")) { transitive false }
    shadowCommon(project(path: ":common")) { transitive false }
}

sourceSets {
    main {
        resources {
            srcDirs += [
                "src/main/generated"
            ]
        }
    }
}

processResources {
    def props = [
        "version": project.version,
        "minecraft_version": rootProject.minecraft_version,
        "minecraft_range_fabric": rootProject.minecraft_range_fabric,
        "fabric_api_min": rootProject.fabric_api_min
    ]
    inputs.properties props

    filesMatching("fabric.mod.json") {
        expand props
    }
    // fabric.mod.json names the access widener; the dev client runs from this module's resources, without common's
    from(project(":common").file("src/main/resources/reterraforged.accesswidener"))
}

shadowJar {
    exclude "architectury.common.json"
    duplicatesStrategy = "exclude"

    configurations = [project.configurations.shadowCommon]
    archiveClassifier.set("dev-shadow")
}

// without remapJar Architectury does not apply @ExpectPlatform (the platform implementations in
// platform/fabric): the production transform, run on the shaded jar; this is the mod jar
tasks.register("transformShadowJar", dev.architectury.plugin.TransformingTask) {
    platform = "fabric"
    input.set(tasks.named("shadowJar").flatMap { it.archiveFile })
    archiveClassifier = "fabric-${rootProject.minecraft_version}"
    destinationDirectory = layout.buildDirectory.dir("libs")
    plusAssign(new dev.architectury.transformer.transformers.TransformExpectPlatform())
    dependsOn tasks.named("shadowJar")
}

tasks.named("assemble") {
    dependsOn tasks.named("transformShadowJar")
}

jar {
    archiveClassifier.set("dev")
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}